[project]
name = "hil2-coordinator"
version = "1.0.0"
description = "HIL2.0 集群闲忙监控与飞书人工交接协调服务（只读监控，绝不自动释放）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "cryptography>=42.0",
    "lark-channel-sdk>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
hil2-coordinator = "hil2.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hil2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:hil2.*"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["hil2"]
omit = ["*/web/*"]
